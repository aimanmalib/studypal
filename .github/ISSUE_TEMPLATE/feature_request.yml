name: Feature request
description: Suggest an idea or improvement for StudyPal
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that StudyPal doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New LLM provider preset
        - New study feature
        - Prompt improvement
        - UI / accessibility
        - Documentation
        - Other
    validations:
      required: true
